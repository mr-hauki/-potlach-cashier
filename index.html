ldset id="accountBlock"><legend>6. Счёт</legend><div id="accounts" class="grid"></div></fieldset><fieldset><legend>7. Комментарий</legend><div class="row"><textarea id="note" placeholder="ТЕСТ, спорное авторство, с какой полки"></textarea><button id="testBtn">ТЕСТ</button></div></fieldset><fieldset><legend>8. Фото <small id="photoHint" class="muted">необязательно</small></legend><label class="file">Сфотографировать<input id="photo" class="hidden" type="file" accept="image/*" capture="environment"></label><img id="preview" class="photo hidden"></fieldset><button id="save" class="primary">Показать QR</button><div id="qrPanel" class="card hidden"><div id="qrSummary"></div><img id="qr" class="qr hidden"><div id="noQr" class="warning hidden">QR для этого счёта не загружен.</div><button id="confirm" class="success">Оплачено — записать</button><button id="back" style="width:100%;margin-top:8px">Назад</button></div></section><section id="journal" class="view"><div class="summary"><div><small>Приход</small><strong id="sumIn">0 ₽</strong></div><div><small>Расход</small><strong id="sumOut">0 ₽</strong></div><div><small>Остаток</small><strong id="balance">0 ₽</strong></div></div><button id="sync" style="width:100%;margin-bottom:10px">Синхронизировать</button><div id="list"></div></section><section id="settings" class="view"><div class="card"><h3>Этот телефон</h3><div class="row"><input id="cashier" placeholder="Имя кассира"><button id="saveCashier">Сохранить</button></div></div><div class="card"><h3>Авторы и направления</h3><div class="row"><input id="newSubject" placeholder="Катя, Бар"><button id="addSubject">Добавить</button></div><div id="subjectSettings"></div></div><div class="card"><h3>Счета и QR</h3><input id="newAccount" placeholder="Маргарита"><label class="file" style="display:block;margin-top:8px">Выбрать QR<input id="newQr" class="hidden" type="file" accept="image/*"></label><button id="addAccount" style="width:100%;margin-top:8px">Добавить счёт</button><div id="accountSettings"></div></div></section></main><nav><button class="active" data-view="operation">Операция</button><button data-view="journal">Журнал</button><button data-view="settings">Настройки</button></nav><div id="toast" class="hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>'use strict';const URL='https://dvgsixehiscqemfaddpn.supabase.co',KEY='sb_publishable_n2Ro5cvbbK0h7P4i6FN4dA_u-zHQCru',EVENT='potlach-24-2026',BUCKET='transaction-photos';const cloud=supabase.createClient(URL,KEY,{auth:{persistSession:false}});const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' ₽';const uuid=()=>crypto.randomUUID();const DEVICE=localStorage.deviceId||(localStorage.deviceId=uuid());let cfg=JSON.parse(localStorage.cfg||'null')||{cashier:'',subjects:[{name:'Автор неизвестен',active:true},{name:'Бар',active:true}],accounts:[]};let kind='income',payment='СБП / перевод',category='',subject='',account='',photoBlob=null;const cats={income:['Продажа работы','Бар — продажи','Прочее'],expense:['Бар — закупка','Организационные расходы','Прочее']};function persist(){localStorage.cfg=JSON.stringify(cfg);render()}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open('potlach-public-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('tx',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function put(x){let d=await openDb();return new Promise((res,rej)=>{let t=d.transaction('tx','readwrite');t.objectStore('tx').put(x);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}async function all(){let d=await openDb();return new Promise((res,rej)=>{let r=d.transaction('tx').objectStore('tx').getAll();r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)})}function render(){ $('cashierBadge').textContent=cfg.cashier?'кассир: '+cfg.cashier:'кассир не задан';$('profileWarning').classList.toggle('hidden',!!cfg.cashier);$('cashier').value=cfg.cashier;$('categories').innerHTML=cats[kind].map(x=>`<button class="choice ${category===x?'active':''}" data-cat="${x}">${x}</button>`).join('');$('subjects').innerHTML=cfg.subjects.filter(x=>x.active).map(x=>`<button class="choice ${subject===x.name?'active':''}" data-sub="${x.name}">${x.name}</button>`).join('');$('accounts').innerHTML=cfg.accounts.filter(x=>x.active).map(x=>`<button class="choice ${account===x.name?'active':''}" data-acc="${x.name}">${x.name}</button>`).join('')||'<span class="muted">Добавь счёт в настройках</span>';$('accountBlock').classList.toggle('hidden',payment==='Наличные');$('photoHint').textContent=/неизвест/i.test(subject)?'обязательно':'необязательно';$('save').textContent=kind==='income'&&payment!=='Наличные'?'Показать QR':kind==='income'?'Записать наличные':'Записать расход';$('subjectSettings').innerHTML=cfg.subjects.map((x,i)=>`<p>${x.name} <button data-toggle-sub="${i}">${x.active?'Скрыть':'Показать'}</button></p>`).join('');$('accountSettings').innerHTML=cfg.accounts.map((x,i)=>`<p>${x.name} · ${x.qr?'QR есть':'нет QR'} <button data-toggle-acc="${i}">${x.active?'Скрыть':'Показать'}</button></p>`).join('')}function draft(){let a=Number($('amount').value);if(!cfg.cashier)throw Error('Укажи кассира');if(!category)throw Error('Выбери категорию');if(!subject)throw Error('Выбери автора');if(!(a>0))throw Error('Введи сумму');if(payment!=='Наличные'&&!account)throw Error('Выбери счёт');if(/неизвест/i.test(subject)&&!photoBlob)throw Error('Для неизвестного автора нужно фото');return{a,note:$('note').value.trim()}}async function saveRecord(){try{let d=draft(),now=new Date().toISOString(),r={id:uuid(),eventId:EVENT,createdAt:now,updatedAt:now,deviceId:DEVICE,cashierName:cfg.cashier,kind,categoryName:category,subjectName:subject,authorshipStatus:/неизвест/i.test(subject)?'unknown':'known',amount:d.a,paymentMethod:payment,accountName:payment==='Наличные'?null:account,note:d.note,photoBlob,photoPath:null,photoUrl:null,voided:false,dirty:true,syncState:'pending'};await put(r);toast('✅ Записано: '+money(d.a));$('amount').value='';$('note').value='';$('photo').value='';$('preview').classList.add('hidden');photoBlob=null;category=subject=account='';$('qrPanel').classList.add('hidden');await showJournal();syncAll()}catch(e){toast(e.message)}}async function shrink(f){let img=new Image(),u=URL.createObjectURL(f);await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=u});let s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);return new Promise(r=>c.toBlob(r,'image/jpeg',.72))}async function syncOne(r){let path=r.photoPath;if(r.photoBlob&&!path){path=`${EVENT}/${r.id}.jpg`;let q=await cloud.storage.from(BUCKET).upload(path,r.photoBlob,{contentType:'image/jpeg',upsert:true});if(q.error)throw q.error}let row={id:r.id,event_id:EVENT,created_at:r.createdAt,updated_at:new Date().toISOString(),device_id:r.deviceId,cashier_name:r.cashierName,kind:r.kind,category_name:r.categoryName,subject_name:r.subjectName,authorship_status:r.authorshipStatus,amount:r.amount,payment_method:r.paymentMethod,account_name:r.accountName,note:r.note,photo_path:path,voided:r.voided};let q=await cloud.from('transactions').upsert(row);if(q.error)throw q.error;let pu=path?cloud.storage.from(BUCKET).getPublicUrl(path).data.publicUrl:null;await put({...r,photoBlob:null,photoPath:path,photoUrl:pu,dirty:false,syncState:'synced'})}async function syncAll(){if(!navigator.onLine)return;try{$('onlineBadge').textContent='синхронизация…';for(let r of (await all()).filter(x=>x.dirty)){try{await syncOne(r)}catch(e){await put({...r,syncState:'error'})}}let q=await cloud.from('transactions').select('*').eq('event_id',EVENT).order('created_at',{ascending:false});if(q.error)throw q.error;for(let x of q.data||[]){let pu=x.photo_path?cloud.storage.from(BUCKET).getPublicUrl(x.photo_path).data.publicUrl:null;await put({id:x.id,eventId:x.event_id,createdAt:x.created_at,updatedAt:x.updated_at,deviceId:x.device_id,cashierName:x.cashier_name,kind:x.kind,categoryName:x.category_name,subjectName:x.subject_name,authorshipStatus:x.authorship_status,amount:Number(x.amount),paymentMethod:x.payment_method,accountName:x.account_name,note:x.note||'',photoBlob:null,photoPath:x.photo_path,photoUrl:pu,voided:x.voided,dirty:false,syncState:'synced'})}$('onlineBadge').textContent='онлайн · сервер';await showJournal()}catch(e){$('onlineBadge').textContent='ошибка сервера';toast(e.message)}}async function showJournal(){let rs=(await all()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),valid=rs.filter(x=>!x.voided),si=valid.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),so=valid.filter(x=>x.kind==='expense').reduce((s,x)=>s+x.amount,0);$('sumIn').textContent=money(si);$('sumOut').textContent=money(so);$('balance').textContent=money(si-so);$('list').innerHTML=rs.map(x=>`<article class="card">${x.photoUrl?`<img src="${x.photoUrl}">`:''}<strong>${x.kind==='income'?'Приход':'Расход'} · ${x.categoryName}</strong><p>${x.subjectName} · ${x.paymentMethod}${x.accountName?' · '+x.accountName:''}</p><p class="muted">Кассир: ${x.cashierName}${x.note?' · '+x.note:''}<br>${new Date(x.createdAt).toLocaleString('ru-RU')}</p><span class="status ${x.dirty?(x.syncState==='error'?'error':'pending'):'synced'}">${x.dirty?'ждёт отправки':'на сервере'}</span><div class="money">${x.kind==='income'?'+':'−'}${money(x.amount)}</div></article>`).join('')||'<p class="muted">Операций пока нет</p>'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.kind){kind=b.dataset.kind;category='';document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));render()}if(b.dataset.payment){payment=b.dataset.payment;document.querySelectorAll('[data-payment]').forEach(x=>x.classList.toggle('active',x===b));render()}if(b.dataset.cat){category=b.dataset.cat;render()}if(b.dataset.sub){subject=b.dataset.sub;render()}if(b.dataset.acc){account=b.dataset.acc;render()}if(b.dataset.view){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.view==='journal')showJournal()}if(b.dataset.toggleSub!==undefined){cfg.subjects[b.dataset.toggleSub].active=!cfg.subjects[b.dataset.toggleSub].active;persist()}if(b.dataset.toggleAcc!==undefined){cfg.accounts[b.dataset.toggleAcc].active=!cfg.accounts[b.dataset.toggleAcc].active;persist()}});$('testBtn').onclick=()=>{$('note').value=$('note').value?'ТЕСТ · '+$('note').value:'ТЕСТ'};$('photo').onchange=async e=>{photoBlob=await shrink(e.target.files[0]);$('preview').src=URL.createObjectURL(photoBlob);$('preview').classList.remove('hidden')};$('save').onclick=()=>{try{let d=draft();if(kind==='income'&&payment!=='Наличные'){let a=cfg.accounts.find(x=>x.name===account);$('qrSummary').textContent=`${subject} · ${money(d.a)} · ${account}`;$('qr').classList.toggle('hidden',!a?.qr);$('noQr').classList.toggle('hidden',!!a?.qr);if(a?.qr)$('qr').src=a.qr;$('qrPanel').classList.remove('hidden')}else saveRecord()}catch(e){toast(e.message)}};$('confirm').onclick=saveRecord;$('back').onclick=()=>$('qrPanel').classList.add('hidden');$('saveCashier').onclick=()=>{cfg.cashier=$('cashier').value.trim();persist();toast('Кассир сохранён')};$('addSubject').onclick=()=>{let n=$('newSubject').value.trim();if(n){cfg.subjects.push({name:n,active:true});$('newSubject').value='';persist()}};$('addAccount').onclick=()=>{let n=$('newAccount').value.trim(),f=$('newQr').files[0];if(!n)return toast('Введи имя счёта');let done=qr=>{cfg.accounts.push({name:n,active:true,qr});$('newAccount').value='';$('newQr').value='';persist()};if(f){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done(null)};$('sync').onclick=syncAll;window.addEventListener('online',syncAll);render();showJournal();syncAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');</script></body></html>
